<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chor Aufbruch – Tickets Adventskonzert</title>
<style>
:root{color-scheme:light dark;--bg:#f2f7f7;--card:#fff;--ink:#1d2b36;--mute:#5b6b76;--teal:#2a8f94;--btn:#1c6a70;--btnink:#fff;--line:#d3e2e3;--ok:#1b7a4a;--warn:#a15c00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191d;--card:#18252b;--ink:#e7eff2;--mute:#9db0b8;--teal:#48b5ba;--btn:#48b5ba;--btnink:#08242a;--line:#2b3d45;--ok:#5fd09a;--warn:#e8a64a}}
:root[data-theme="dark"]{--bg:#10191d;--card:#18252b;--ink:#e7eff2;--mute:#9db0b8;--teal:#48b5ba;--btn:#48b5ba;--btnink:#08242a;--line:#2b3d45;--ok:#5fd09a;--warn:#e8a64a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.hero{text-align:center;padding:20px 16px 8px}.logo{display:inline-block;background:#fff;border-radius:14px;padding:8px 14px}.logo img{height:64px;display:block}
h1{margin:12px 0 4px;font-size:1.7rem;color:var(--teal)}.hero p{margin:0;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
h2{margin:0 0 12px;font-size:1.05rem;display:flex;gap:10px;align-items:center}h2 i{font-style:normal;background:var(--btn);color:var(--btnink);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;position:relative}
.opt:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.opt input{position:absolute;top:12px;right:12px;accent-color:var(--teal)}.opt small,.mute,small{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row div small{display:block}
.step{display:flex;align-items:center;gap:12px}.step button{width:38px;height:38px;border-radius:50%;border:2px solid var(--teal);background:none;color:var(--ink);font-size:1.2rem;cursor:pointer}.step output{min-width:20px;text-align:center;font-weight:700}
label.f{display:block;margin-bottom:10px;font-size:.9rem;color:var(--mute)}
input[type=text],input[type=email]{width:100%;padding:10px;margin-top:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:90px 1fr;gap:10px}
.sum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}.sum b{font-size:1.15rem}
.btn{display:inline-block;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}.btn.full{width:100%;margin-top:12px}
.ticket{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--card);border:2px dashed var(--teal);border-radius:16px;padding:18px;margin:14px 0}
@media(max-width:480px){.ticket{grid-template-columns:1fr}}
.ticket h3{margin:0;color:var(--teal)}.ticket .qr{background:#fff;padding:8px;border-radius:8px;align-self:center;justify-self:center}.ticket .qr svg{width:136px;height:136px;display:block}
.ticket dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.ticket dt{color:var(--mute)}.ticket dd{margin:0;font-weight:600}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--warn);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.scroll{overflow-x:auto}
textarea{width:100%;height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:12px monospace}
.kv td:first-child{color:var(--mute);padding-right:14px}.foot{text-align:center;font-size:.8rem;color:var(--mute);margin-top:20px}
@media print{body *{visibility:hidden}.ticket,.ticket *{visibility:visible}.ticket{position:absolute;left:0;top:0;width:100%;break-inside:avoid}}
</style></head>

};
function ticket(b){
  const t=[b.a?b.a+' Erwachsene':'',b.k?b.k+' Kinder/Jugendl.':''].filter(Boolean).join(' · ');
  return`<div class="ticket"><div><h3>Chor Aufbruch · Adventskonzert</h3><dl>
  <dt>Termin</dt><dd>${DAYS[b.day]}, 17:00 Uhr</dd><dt>Ort</dt><dd>Schlosskirche Brühl</dd>
  <dt>Name</dt><dd>${esc(b.vn)} ${esc(b.nn)}</dd><dt>Tickets</dt><dd>${t}</dd><dt>Ticket-Nr.</dt><dd>${b.id}</dd></dl>
  <p class="mute" style="margin:10px 0 0;font-size:.85rem">Gilt als Eintrittskarte für alle genannten Personen – bitte ausgedruckt oder auf dem Handy vorzeigen.</p></div>
  <div class="qr">${qr(['AUFBRUCH',b.id,b.day,b.a,b.k].join('|'))}</div></div>`;
}
function showDone(b){
  const ref=`Aufbruch ${b.id} ${b.nn}`;
  const pay=b.sum===0?'<p class="ok">Kostenfrei – keine Zahlung nötig.</p>':b.pay==='paypal'
    ?`<p>Bitte <b>${eur(b.sum)}</b> per PayPal senden (Verwendungszweck: <b>${b.id}</b>):</p><a class="btn" href="${C.paypal}/${b.sum}EUR" target="_blank" rel="noopener">Mit PayPal bezahlen</a>`
    :`<p>Bitte überweisen Sie den Betrag:</p><table class="kv"><tr><td>Empfänger</td><td>${C.holder}</td></tr><tr><td>IBAN</td><td><b>${C.iban}</b></td></tr><tr><td>Betrag</td><td><b>${eur(b.sum)}</b></td></tr><tr><td>Verwendungszweck</td><td><b>${esc(ref)}</b></td></tr></table><div style="margin-top:12px"><canvas id="gc" style="width:160px;height:160px;background:#fff;border-radius:8px;display:block;margin-bottom:8px"></canvas><button class="btn ghost" id="gcdl" type="button">Girocode herunterladen (PNG)</button><p class="mute" style="font-size:.85rem">Girocode in der Banking-App scannen oder, falls die App es anbietet, das Bild laden. Betrag, IBAN und Verwendungszweck sind dann schon ausgefüllt.</p></div>`;
  const body=`Anmeldung Adventskonzert%0ANr. ${b.id}%0A${DAYS[b.day]}, 17 Uhr%0A${b.a} Erw., ${b.k} Kinder/Jug.%0A${encodeURIComponent(b.vn+' '+b.nn)}%0AZustellung: ${b.ship==='door'?'Abendkasse':'E-Mail'}%0AZahlung: ${b.pay} ${b.sum} EUR`;
  $('#done').innerHTML=`<div class="box"><h2 class="ok">✓ Anmeldung erfasst, vielen Dank, ${esc(b.vn)}!</h2>
  ${b.ship==='door'?`<p>Ihr Name ist an der Abendkasse hinterlegt: einfach <b>${esc(b.vn)} ${esc(b.nn)}</b> nennen. Zutritt nach Zahlungseingang.</p>`:'<p>Ihr Ticket mit QR-Code (gültig nach Zahlungseingang):</p>'}</div>${b.ship==='door'?`<div class="box"><b>${DAYS[b.day]}, 17:00 Uhr</b><br>${b.a} Erwachsene · ${b.k} Kinder/Jugendliche<br>Anmelde-Nr.: ${b.id}</div>`:ticket(b)}
  <div class="box"><h2>Bezahlung</h2>${pay}${b.sum?'<p class="warn">Die Reservierung gilt nach Zahlungseingang.</p>':''}</div>
  <div class="box">${b.ship==='door'?'':'<button class="btn" onclick="window.print()">Ticket drucken / als PDF</button>'}
  <a class="btn ghost" ${C.sheet?'hidden':''} href="mailto:${C.mail}?cc=${encodeURIComponent(b.mail)}&subject=${encodeURIComponent('Anmeldung Adventskonzert '+b.id)}&body=${body}">Bestätigung per E-Mail senden</a>
  <p><button class="btn ghost" id="again">Weitere Anmeldung</button></p></div>`;
  $('#again').onclick=()=>{cur=null;route()};
  const gc=$('#gc');if(gc){drawQr(gc,epc(b),8);$('#gcdl').onclick=()=>gc.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='Girocode-Aufbruch-'+b.id+'.png';a.click()})}
}
function admin(){
  const rows=B.slice().sort((x,y)=>x.ts-y.ts);
  const st=Object.keys(DAYS).map(d=>{const r=B.filter(x=>x.day===d),n=r.reduce((s,x)=>s+x.a+x.k,0);
    return`<div class="box"><b>${DAYS[d]}</b><br>${r.length} Anmeldungen · ${r.reduce((s,x)=>s+x.a,0)} Erw. · ${r.reduce((s,x)=>s+x.k,0)} Kinder<br>Auslastung: ${n}/${C.cap} Plätze (${Math.round(n/C.cap*100)} %)<br>Erwartet: ${eur(r.reduce((s,x)=>s+x.sum,0))} · eingegangen: <b>${eur(r.filter(x=>x.paid).reduce((s,x)=>s+x.sum,0))}</b></div>`}).join('');
  const csv=['ID;Datum;Nachname;Vorname;E-Mail;Erwachsene;Kinder;Versand;Anschrift;Zahlungsart;Betrag;Bezahlt;Zeitpunkt'].concat(rows.map(x=>[x.id,x.day,x.nn,x.vn,x.mail,x.a,x.k,x.ship,x.adr,x.pay,x.sum,x.paid?'ja':'nein',new Date(x.ts).toLocaleString('de-DE')].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';'))).join('\n');
  $('#admin').innerHTML=`<div class="box"><h2>Verwaltung · Anmeldungen</h2><p class="mute">Hinweis: Diese Tabelle zeigt die Anmeldungen, die in diesem Browser erfasst wurden.</p></div>${st}
  <div class="box scroll"><table><tr><th>Nr.</th><th>Tag</th><th>Name</th><th>E-Mail</th><th>Erw.</th><th>Kinder</th><th>Versand</th><th>Betrag</th><th>Bezahlt</th></tr>
  ${rows.map(x=>`<tr><td>${x.id}</td><td>${x.day.slice(8)}.12.</td><td>${esc(x.nn)}, ${esc(x.vn)}</td><td>${esc(x.mail)}</td><td>${x.a}</td><td>${x.k}</td><td>${x.ship}</td><td>${eur(x.sum)}</td><td><button class="btn ghost" style="padding:2px 10px" data-p="${x.id}">${x.paid?'✓ ja':'offen'}</button></td></tr>`).join('')}</table></div>
  <div class="box"><b>CSV (für Excel/Sheets)</b><textarea readonly onclick="this.select()">${esc(csv)}</textarea></div>`;
}
function route(){
  const adm=location.hash==='#verwaltung';
  $('#admin').hidden=!adm;$('#book').hidden=adm||!!cur;$('#done').hidden=adm||!cur;
  if(adm)admin();else if(cur)showDone(cur);
}
addEventListener('hashchange',route);sync();route();
</script></body></html>
